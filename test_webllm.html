<!DOCTYPE html>
<html>
<head>
  <title>EcoPrompt Tester</title>
  <script type="module">

    import * as webllm from "https://esm.run/@mlc-ai/web-llm";
    const v = Date.now();

    const { classify, classifyWithLLM } = await import(`./src/agents/classifier.js?v=${v}`);
    const { route }              = await import(`./src/agents/router.js?v=${v}`);
    const { compressWithEngine } = await import(`./src/agents/compressor.js?v=${v}`);
    const { estimateTokens }     = await import(`./src/utils/tokenizer.js?v=${v}`);
    const { preprocessWithLLM }  = await import(`./src/utils/preprocessor.js?v=${v}`);
    const { buildStats }         = await import(`./src/utils/carbon.js?v=${v}`);
    // // ── All logic from real .js files — ZERO logic written here ──────────────
    // const { classify }           = await import("./src/agents/classifier.js");
    // const { route }              = await import("./src/agents/router.js");
    // const { compressWithEngine } = await import("./src/agents/compressor.js");
    // const { estimateTokens }     = await import("./src/utils/tokenizer.js");
    // const { preprocessWithLLM }  = await import("./src/utils/preprocessor.js");
    // const { buildStats }         = await import("./src/utils/carbon.js");

    // ── Display helper only — zero business logic ─────────────────────────────
    function badgeColor(label) {
      return {
        FACTUAL:  "#00FFB2",
        SIMPLE:   "#38BDF8",
        MODERATE: "#FFB347",
        COMPLEX:  "#FF6B6B",
      }[label] ?? "#94A3B8";
    }

    // ── UI elements ───────────────────────────────────────────────────────────
    const OUTPUT      = document.getElementById("output");
    const BTN         = document.getElementById("btn");
    const INPUT       = document.getElementById("input");
    const LOADER      = document.getElementById("loader");
    const PROG_BAR    = document.getElementById("prog-bar");
    const PROG_PCT    = document.getElementById("prog-pct");
    const PROG_TEXT   = document.getElementById("prog-text");
    const PROG_PHASE  = document.getElementById("prog-phase");
    const PROG_STEPS  = document.getElementById("prog-steps");
    const MODEL_READY = document.getElementById("model-ready");
    const PROC_STATUS = document.getElementById("proc-status");

    let engine = null;

    // ── Step logger ───────────────────────────────────────────────────────────
    function logStep(text, status = "done") {
      const icon = { done: "✅", active: "⚙️", waiting: "⏳", error: "❌" }[status] ?? "⏳";
      const div  = document.createElement("div");
      div.className = "step-item";
      div.innerHTML = `<span class="step-icon">${icon}</span><span>${text}</span>`;
      PROG_STEPS.appendChild(div);
      PROG_STEPS.scrollTop = PROG_STEPS.scrollHeight;
    }

    function clearSteps() { PROG_STEPS.innerHTML = ""; }

    // ── Load model ────────────────────────────────────────────────────────────
    async function loadModel() {
      LOADER.style.display      = "block";
      MODEL_READY.style.display = "none";
      BTN.disabled = true;

      clearSteps();
      logStep("Initializing WebLLM engine...", "active");
      logStep("Checking WebGPU support...", "waiting");
      logStep("Fetching Phi-3-mini weights (~2GB)...", "waiting");
      logStep("Loading model into GPU memory...", "waiting");
      logStep("Warming up inference engine...", "waiting");

      try {
        engine = await webllm.CreateMLCEngine(
          "Phi-3-mini-4k-instruct-q4f16_1-MLC",
          {
            initProgressCallback: (p) => {
              const pct  = Math.round(p.progress * 100);
              const text = p.text ?? "";

              PROG_BAR.style.width  = `${pct}%`;
              PROG_PCT.textContent  = `${pct}%`;
              PROG_TEXT.textContent = text;

              if (pct < 10)      PROG_PHASE.textContent = "🔍 Checking WebGPU...";
              else if (pct < 50) PROG_PHASE.textContent = "📥 Downloading weights...";
              else if (pct < 80) PROG_PHASE.textContent = "💾 Loading into memory...";
              else if (pct < 95) PROG_PHASE.textContent = "⚡ Compiling shaders...";
              else               PROG_PHASE.textContent = "🔥 Warming up engine...";

              if (pct === 10)  { clearSteps(); logStep("WebGPU detected ✓", "done"); logStep("Downloading model weights...", "active"); }
              if (pct === 50)  { logStep("50% — weights downloaded", "done"); logStep("Loading into GPU memory...", "active"); }
              if (pct === 80)  { logStep("Model loaded into memory ✓", "done"); logStep("Compiling WebGPU shaders...", "active"); }
              if (pct === 95)  { logStep("Shaders compiled ✓", "done"); logStep("Warming up engine...", "active"); }
              if (pct === 100) { logStep("Engine ready ✓", "done"); }
            },
          }
        );

        LOADER.style.display      = "none";
        MODEL_READY.style.display = "flex";
        BTN.disabled    = false;
        BTN.textContent = "▶ Compress Prompt";
        clearSteps();
        logStep("Phi-3-mini fully loaded ✓", "done");
        logStep("WebGPU inference active ✓", "done");
        logStep("Ready to compress prompts ✓", "done");

      } catch (e) {
        PROG_PHASE.textContent    = "❌ Failed";
        PROG_TEXT.textContent     = e.message;
        PROG_BAR.style.background = "#FF4444";
        clearSteps();
        logStep("WebGPU error: " + e.message, "error");
        logStep("Fix: chrome://flags → enable WebGPU", "error");
        logStep("Fix: close other tabs to free RAM", "error");
      }
    }

    // ── Button click — orchestration only, all logic from .js files ──────────
    BTN.addEventListener("click", async () => {
      const rawPrompt = INPUT.value.trim();
      if (!rawPrompt) { PROC_STATUS.textContent = "❌ Enter a prompt first"; return; }
      if (!engine)    { PROC_STATUS.textContent = "❌ Model not loaded yet";  return; }

      BTN.disabled     = true;
      OUTPUT.innerHTML = "";

      // Step 1 — preprocessor.js
      PROC_STATUS.textContent = "🧹 Step 1/4 — Preprocessing...";
      const { cleaned, method: prepMethod, wasModified } =
        await preprocessWithLLM(rawPrompt, engine);

      // Step 2 — classifier.js
      PROC_STATUS.textContent = "🏷️ Step 2/4 — Classifying...";
      const classification = await classifyWithLLM(cleaned, engine);

      // Step 3 — router.js
      PROC_STATUS.textContent = "🔀 Step 3/4 — Routing...";
      const routeResult = route(classification);
      const color       = badgeColor(classification.label);

      // Step 4 — compressor.js
      // Pass classification.label so FACTUAL/SIMPLE skip LLM automatically
      PROC_STATUS.textContent = "⚙️ Step 4/4 — Compressing...";
      const start = Date.now();
      let compressed, method, origTokens, compTokens, saved, latency, carbonData;

      if (routeResult.shouldCompress) {
        const result = await compressWithEngine(cleaned, engine, classification.label);
        compressed   = result.compressed;
        method       = result.method;
        origTokens   = result.originalTokens;
        compTokens   = result.compressedTokens;
        saved        = result.savingPercent;
        latency      = ((Date.now() - start) / 1000).toFixed(1);
        carbonData   = buildStats(cleaned, compressed, routeResult.modelSuggestion.to);
      } else {
        // PATH C — FACTUAL, skip AI entirely
        compressed = cleaned;
        method     = "skip-ai";
        origTokens = estimateTokens(rawPrompt);
        compTokens = origTokens;
        saved      = 100;
        latency    = ((Date.now() - start) / 1000).toFixed(1);
        carbonData = buildStats(rawPrompt, rawPrompt, "default");
      }

      // ── Render output ─────────────────────────────────────────────────────
      OUTPUT.innerHTML = `

        ${wasModified ? `
        <div class="card" style="border-left:4px solid #FFB347">
          <div class="label" style="color:#FFB347">🧹 Preprocessed · ${prepMethod}</div>
          <div class="text" style="margin-top:6px">
            <span style="color:#64748B">Raw &nbsp;&nbsp;&nbsp;→ </span>${rawPrompt}<br/>
            <span style="color:#FFB347">Cleaned → </span>${cleaned}
          </div>
        </div>` : ""}

        <div class="card" style="border-left:4px solid ${color}">
          <div class="label" style="color:${color}">
            🏷️ ${classification.label}
            &nbsp;·&nbsp; ${Math.round(classification.confidence * 100)}% confidence
            &nbsp;·&nbsp; score: ${classification.score ?? "N/A"}
            &nbsp;·&nbsp; ${routeResult.modelSuggestion.badge}
          </div>
          <div class="text" style="margin-top:6px">${routeResult.reason}</div>
        </div>

        <div class="card" style="border-left:4px solid #38BDF8">
          <div class="label" style="color:#38BDF8">🤖 Model Recommendation · PATH ${routeResult.path}</div>
          <div class="text" style="margin-top:8px; display:flex; flex-direction:column; gap:6px">
            <div><span style="color:#94A3B8">Recommended → </span><strong style="color:#00FFB2">${routeResult.modelSuggestion.recommended}</strong></div>
            <div><span style="color:#94A3B8">Alternatives → </span><span style="color:#64748B">${routeResult.modelSuggestion.alternatives.join(", ")}</span></div>
            <div><span style="color:#94A3B8">Why &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;→ </span><span style="color:#64748B">${routeResult.modelSuggestion.reason}</span></div>
            <div><span style="color:#94A3B8">Cost &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;→ </span><span style="color:#64748B">${routeResult.modelSuggestion.costSaving}</span></div>
            <div><span style="color:#94A3B8">CO₂ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;→ </span><span style="color:#64748B">${routeResult.modelSuggestion.co2Saving}</span></div>
          </div>
        </div>

        <div class="card">
          <div class="label" style="color:#FF6B6B">📝 Original — ~${origTokens} tokens</div>
          <div class="text">${rawPrompt}</div>
        </div>

        <div class="arrow">↓ ${method} · ${latency}s · PATH ${routeResult.path}</div>

        <div class="card" style="border-color:${saved > 0 ? "#00FFB2" : "#64748B"}">
          <div class="label" style="color:${saved > 0 ? "#00FFB2" : "#64748B"}">
            ${saved > 0 ? "✅" : "⚠️"} ${routeResult.path === "C"
              ? "Skipped AI — use web search instead"
              : `Compressed — ~${compTokens} tokens (${saved}% saved)`}
          </div>
          <div class="text">${routeResult.path === "C"
            ? `No AI needed — search the web for: <strong style="color:#00FFB2">${cleaned}</strong>`
            : compressed}
          </div>
        </div>

        <div class="card" style="border-left:4px solid #00FFB2">
          <div class="label" style="color:#00FFB2">🌍 Carbon & Energy Impact</div>
          <div class="carbon-grid" style="margin-top:10px">
            <div class="carbon-stat">
              <div class="carbon-val" style="color:#00FFB2">${carbonData.co2Grams}g</div>
              <div class="carbon-key">CO₂ Saved</div>
            </div>
            <div class="carbon-stat">
              <div class="carbon-val" style="color:#38BDF8">${carbonData.waterMl}ml</div>
              <div class="carbon-key">Water Saved</div>
            </div>
            <div class="carbon-stat">
              <div class="carbon-val" style="color:#A78BFA">${carbonData.whSaved}Wh</div>
              <div class="carbon-key">Energy Saved</div>
            </div>
            <div class="carbon-stat">
              <div class="carbon-val" style="color:#FB923C">${carbonData.equiv.treeDays}</div>
              <div class="carbon-key">Tree Days</div>
            </div>
            <div class="carbon-stat">
              <div class="carbon-val" style="color:#F472B6">${carbonData.equiv.smartphoneCharges}</div>
              <div class="carbon-key">Phone Charges</div>
            </div>
            <div class="carbon-stat">
              <div class="carbon-val" style="color:#FFB347">${carbonData.efficiencyScore}/100</div>
              <div class="carbon-key">Eco Score</div>
            </div>
          </div>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="stat-val" style="color:#00FFB2">${saved}%</div>
            <div class="stat-key">${routeResult.path === "C" ? "AI Skipped" : "Tokens Saved"}</div>
          </div>
          <div class="stat">
            <div class="stat-val" style="color:#38BDF8">${Math.max(0, origTokens - compTokens)}</div>
            <div class="stat-key">Tokens Freed</div>
          </div>
          <div class="stat">
            <div class="stat-val" style="color:#A78BFA">${latency}s</div>
            <div class="stat-key">Latency</div>
          </div>
          <div class="stat">
            <div class="stat-val" style="color:#FB923C">$${(Math.max(0, origTokens - compTokens) * 0.00003).toFixed(5)}</div>
            <div class="stat-key">$ Saved</div>
          </div>
        </div>
      `;

      PROC_STATUS.textContent = "✅ Done — enter another prompt to test again";
      BTN.disabled = false;
    });

    loadModel();
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #030712;
      color: #E2E8F0;
      font-family: 'Courier New', monospace;
      padding: 32px 24px;
      max-width: 780px;
      margin: 0 auto;
    }

    h1 {
      font-size: 26px;
      font-weight: 900;
      background: linear-gradient(90deg, #00FFB2, #38BDF8, #A78BFA);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
      margin-bottom: 6px;
    }

    .sub {
      color: #475569;
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 28px;
      text-transform: uppercase;
    }

    /* ── Loader ──────────────────────────────────────────────────────────────── */
    #loader {
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 14px;
      padding: 28px;
      margin-bottom: 24px;
      display: none;
    }

    .loader-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .loader-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #00FFB2, #38BDF8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.7; transform: scale(0.95); }
    }

    .loader-title { font-size: 14px; font-weight: 700; color: #E2E8F0; }
    .loader-sub   { font-size: 11px; color: #475569; margin-top: 2px; }

    .prog-track {
      background: #1E293B;
      border-radius: 999px;
      height: 8px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    #prog-bar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #00FFB2, #38BDF8, #A78BFA);
      transition: width 0.4s ease;
      position: relative;
    }

    #prog-bar::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 40px; height: 100%;
      background: rgba(255,255,255,0.3);
      border-radius: 999px;
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0%   { opacity: 0; transform: translateX(-20px); }
      50%  { opacity: 1; }
      100% { opacity: 0; transform: translateX(20px); }
    }

    .prog-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    #prog-phase { font-size: 12px; color: #38BDF8; font-weight: 700; }
    #prog-pct   { font-size: 20px; font-weight: 900; color: #00FFB2; }
    #prog-text  { font-size: 10px; color: #475569; margin-bottom: 16px; min-height: 14px; }

    #prog-steps {
      background: #020817;
      border: 1px solid #1E293B;
      border-radius: 8px;
      padding: 10px 12px;
      max-height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #64748B;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .step-icon { font-size: 12px; flex-shrink: 0; }

    #model-ready {
      background: #022c22;
      border: 1px solid #00FFB2;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #00FFB2;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 10px;
      color: #E2E8F0;
      font-family: inherit;
      font-size: 13px;
      padding: 14px;
      resize: vertical;
      min-height: 110px;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: #00FFB2; }

    button {
      background: #00FFB2;
      color: #030712;
      border: none;
      border-radius: 8px;
      padding: 12px 32px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 12px;
      letter-spacing: 1px;
      transition: opacity 0.2s;
    }

    button:disabled { background: #1E293B; color: #475569; cursor: not-allowed; }

    #proc-status {
      color: #FFB347;
      font-size: 12px;
      margin-bottom: 24px;
      min-height: 18px;
      letter-spacing: 0.5px;
    }

    .card {
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 10px;
      animation: fadeIn 0.3s ease;
    }

    .label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .text  { font-size: 13px; line-height: 1.7; color: #CBD5E1; }
    .arrow { text-align: center; color: #334155; font-size: 12px; margin: 6px 0; letter-spacing: 1px; }

    .carbon-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .carbon-stat {
      background: #020817;
      border: 1px solid #1E293B;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .carbon-val { font-size: 18px; font-weight: 900; margin-bottom: 4px; }
    .carbon-key { font-size: 10px; color: #475569; letter-spacing: 1px; text-transform: uppercase; }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .stat {
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 8px;
      padding: 14px 10px;
      text-align: center;
      animation: fadeIn 0.4s ease;
    }

    .stat-val { font-size: 20px; font-weight: 900; margin-bottom: 5px; }
    .stat-key { font-size: 10px; color: #475569; letter-spacing: 1px; text-transform: uppercase; }
  </style>
</head>
<body>
  <h1>EcoPrompt Tester</h1>
  <div class="sub">Real .js Files · Zero Logic In Test · WebLLM Phi-3 Mini · Carbon Aware</div>

  <div id="loader">
    <div class="loader-header">
      <div class="loader-icon">🧠</div>
      <div>
        <div class="loader-title">Loading Phi-3-mini-4k</div>
        <div class="loader-sub">First load downloads ~2GB — cached after that</div>
      </div>
    </div>
    <div class="prog-row">
      <div id="prog-phase">⏳ Starting up...</div>

    <div class="prog-track">
      <div id="prog-bar"></div>
    </div>
    <div id="prog-text">Initializing...</div>
    <div id="prog-steps"></div>
  </div>

  <div id="model-ready">
    ✅ &nbsp; Phi-3-mini loaded — WebGPU inference active
  </div>

  <textarea
    id="input"
    placeholder="Paste any prompt — messy, clean, short, long, misspelled, casual...

Examples:
- heyy baby can you help me with my math homework what is 2+2
- can u plz hlp me undrstnd wat is machine learning
- I was wondering if you could help me write a SQL query joining 3 tables...
- Design a scalable microservice architecture for an e-commerce platform"></textarea>

  <button id="btn" disabled>⏳ Loading model...</button>
  <div id="proc-status"></div>
  <div id="output"></div>
</body>
</html>
